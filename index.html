  const ms=D.maps.filter(m=>its({h:st.h,m:m.id}).length);
  if(!ms.find(m=>m.id===st.m)) st.m=ms[0].id;
  const ks=D.skills[st.h].filter(k=>its({h:st.h,m:st.m,k}).length);
  if(!ks.includes(st.k)) st.k=ks[0];
  return {ms,ks};
}
function render(){
  const {ms,ks}=fix(); const hero=D.heroes.find(x=>x.id===st.h);
  document.documentElement.style.setProperty('--accent',hero.color);
  document.querySelector('meta[name=theme-color]').content='#0e0f13';
  localStorage.setItem('vl3',JSON.stringify(st)); history.replaceState(null,'','#'+[st.h,st.m,st.k,st.s].join('/'));
  const H=$('#heroes');H.innerHTML='';
  D.heroes.forEach(x=>{const b=el('button','hb'+(x.id===st.h?' on':''),esc(x.cn)+'<small>'+its({h:x.id}).length+' 个</small>');b.style.setProperty('--c',x.color);b.onclick=()=>{st.h=x.id;render();scrollTo(0,0)};H.append(b)});
  const M=$('#maps');M.innerHTML='<span class="lab">地图</span>';
  ms.forEach(m=>{const b=el('button','chip'+(m.id===st.m?' on':''),esc(m.cn)+'<small>'+its({h:st.h,m:m.id}).length+'</small>');b.onclick=()=>{st.m=m.id;render();scrollTo(0,0)};M.append(b)});
  const K=$('#skills');K.innerHTML='<span class="lab">分类</span>';
  ks.forEach(k=>{const b=el('button','chip'+(k===st.k?' on':''),esc(k)+'<small>'+its({h:st.h,m:st.m,k}).length+'</small>');b.onclick=()=>{st.k=k;render();scrollTo(0,0)};K.append(b)});
  const seg=el('div','seg');[['','全部'],['进攻','进攻'],['防守','防守']].forEach(([v,t])=>{const n=its({h:st.h,m:st.m,k:st.k,side:v}).length;const b=el('button',(v===st.s?'on':'')+(v&&!n?' dis':''),t+(v?' '+n:''));if(!(v&&!n))b.onclick=()=>{st.s=v;render()};seg.append(b)});K.append(seg);
  const list=its({h:st.h,m:st.m,k:st.k,side:st.s}).sort((a,b)=>(a.side>b.side?1:-1)||b.n-a.n);
  const mapcn=D.maps.find(m=>m.id===st.m).cn;
  const C=$('#list');C.innerHTML='';
  C.append(el('div','title','<h1>'+esc(hero.cn)+' · '+esc(mapcn)+' · '+esc(st.k)+'</h1><span>'+list.length+' 个</span>'));
  if(!list.length){C.append(el('div','empty','这里没有'+(st.s||'')+'的内容，换个攻守试试'));return}
  list.forEach(i=>{
    const c=el('article','card');
    const sc=i.side==='进攻'?'atk':'def';
    c.append(el('div','head',(i.side?'<span class="b '+sc+'">'+esc(i.side)+'</span>':'')+(i.site?'<span class="b site">'+esc(i.site)+'</span>':'')+'<h3>'+esc(i.name)+'</h3>'+(i.n?'<span class="rep'+(i.n>=2?' hi':'')+'">'+i.n+'人教</span>':'')));
    const isSet=i.k==='套路';
    if(isSet&&i.steps.length) c.append(el('ol','steps',i.steps.map(s=>'<li>'+esc(s)+'</li>').join('')));
    const caps=isSet?['<b>布置</b>','<b>关键一步</b>','<b>效果</b>'+esc(i.ce)]:['<b>站</b>'+esc(i.cs),'<b>瞄</b>'+esc(i.ca)+(i.ct?'<span class="thr">'+esc(i.ct)+'</span>':''),'<b>效果</b>'+esc(i.ce)];
    const t=el('div','trio');
    i.img.forEach((s,j)=>{if(!s)return;const f=el('figure',null,'<img loading="lazy" src="'+s+'"><span class="n">'+'①②③'[j]+'</span><figcaption>'+caps[j]+'</figcaption>');f.querySelector('img').onclick=()=>{$('#lb img').src=s;$('#lb').style.display='flex'};t.append(f)});
    c.append(t);
    if(i.clip){const d=el('details','more','<summary>▶ 看过程</summary><video muted loop playsinline controls preload="none" src="'+i.clip+'"></video><a href="'+i.src.url+'" target="_blank">原视频 '+esc(i.src.at)+' · '+esc(i.src.who)+'</a>');
      d.addEventListener('toggle',()=>{const v=d.querySelector('video');d.open?v.play().catch(()=>{}):v.pause()});c.append(d)}
    C.append(c);
  });
}
const h=location.hash.slice(1).split('/').map(decodeURIComponent);
if(h[0]&&D.heroes.find(x=>x.id===h[0])){st.h=h[0];st.m=h[1]||null;st.k=h[2]||null;st.s=h[3]||''}
$('#lb').onclick=()=>$('#lb').style.display='none';
render();
</script></body></html>
